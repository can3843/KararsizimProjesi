<header class="site-header">
  <div class="site-header__inner container">
    <a class="site-header__logo" href="{% url 'polls:index' %}">Kararsızım</a>
    <nav class="site-header__nav" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <a class="site-header__user" href="{% url 'polls:profile' user.username %}">@{{ user.username }}</a>
        <a class="button button--primary" href="{% url 'polls:create' %}">Anket oluştur</a>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="button button--secondary" type="submit">Çıkış yap</button>
        </form>
      {% else %}
        <a class="button button--secondary" href="{% url 'accounts:login' %}">Giriş yap</a>
        <a class="button button--primary" href="{% url 'accounts:register' %}">Kayıt ol</a>
      {% endif %}
    </nav>
  </div>
</header>
