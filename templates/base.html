{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kararsızım — Sen sor, kalabalık karar versin{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Kararsız kaldığın şeyi küçük bir ankete dönüştür, kalabalık karar versin.{% endblock %}">
  <link rel="icon" href="{% static 'img/logo.svg' %}" type="image/svg+xml">

  <meta property="og:site_name" content="Kararsızım">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="{% block og_title %}Kararsızım{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Sen sor, kalabalık karar versin.{% endblock %}">
  <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/og-image.png' %}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kararsızım karar çubuğu">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  {% include "partials/header.html" %}
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/toast.html" %}
  <script src="{% static 'js/toast.js' %}" defer></script>
  <script src="{% static 'js/submit-lock.js' %}" defer></script>
</body>
</html>
